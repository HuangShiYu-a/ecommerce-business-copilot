<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>E-commerce Business Copilot</title>
  <style>
    body { font-family: system-ui, "Microsoft YaHei", sans-serif; margin: 2rem; max-width: 720px; }
    h1 { font-size: 1.2rem; }
    input[type=text] { width: 100%; padding: .5rem; box-sizing: border-box; }
    pre { background: #f6f8fa; padding: 1rem; white-space: pre-wrap; word-break: break-word; }
    .row { margin: .5rem 0; display: flex; gap: .5rem; align-items: center; }
    button { padding: .4rem .9rem; cursor: pointer; }
    #confirmBar { display: none; }
  </style>
</head>
<body>
  <h1>E-commerce Business Copilot</h1>
  <div>
    <input id="msg" type="text" value="帮我看看 SKU_01_STOCKOUT_01 需不需要补货" />
  </div>
  <div class="row">
    <select id="store">
      <option value="1">Store 01</option>
      <option value="2">Store 02</option>
    </select>
    <button id="send">发送</button>
  </div>
  <div class="row" id="confirmBar">
    <span id="confirmText"></span>
    <button id="accept">确认</button>
    <button id="reject">拒绝</button>
  </div>
  <pre id="out">等待输入…</pre>
  <script>
    let threadId = null;
    const show = (obj) => { out.textContent = JSON.stringify(obj, null, 2); };

    async function post(path, body) {
      const r = await fetch(path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      return r.json();
    }

    async function onSend() {
      confirmBar.style.display = "none";
      out.textContent = "请求中…";
      const res = await post("/api/agent", {
        message: msg.value,
        store_id: Number(store.value),
      });
      if (res.confirm_needed) {
        threadId = res.thread_id;
        confirmText.textContent = res.message + "（是否确认？）";
        confirmBar.style.display = "flex";
        out.textContent = JSON.stringify(res, null, 2);
      } else {
        threadId = null;
        show(res);
      }
    }

    async function onDecision(decision) {
      if (!threadId) return;
      confirmBar.style.display = "none";
      out.textContent = "处理中…";
      const res = await post("/api/confirm", { thread_id: threadId, decision });
      threadId = null;
      show(res);
    }

    send.onclick = onSend;
    accept.onclick = () => onDecision("accepted");
    reject.onclick = () => onDecision("rejected");
    msg.onkeydown = (e) => { if (e.key === "Enter") onSend(); };
  </script>
</body>
</html>
