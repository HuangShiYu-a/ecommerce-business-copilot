# RAG 黄金问答（M4）— 全量 30 条
#
# schema 约定（对齐 evaluation-plan-v1.md §2.3 / §3.4，doc 级 acceptable_docs）：
#   id              rg-xxx
#   query           检索问题
#   store_id        门店（1）
#   answerable      true（知识库可答）/ false（域外，测拒答）
#   acceptable_docs [黄金文档标题] —— 允许多个合法证据（doc 级；相关性按 chunk 所属 doc 判定）
#   scope           （可选）业务上下文过滤（如 conflict 用例的 tags）
#   expect          （可选）RULE_CONFLICT —— 单列，不进 Hit@5/MRR 分母
#
# 判定（§3.4）：
#   Hit@5 = top-5 chunk 中出现 ≥1 个 acceptable document / answerable 条数
#   MRR@10 = 首个相关 chunk 排名倒数均值
#   Correct/False Abstention = Retrieval 级（search_knowledge 是否空证据）
#   unanswerable 用例为「明显域外」问题（实测 bge-m3 下返回空，见阶段1 A3）
# 分布：22 answerable + 2 RULE_CONFLICT + 6 unanswerable = 30

cases:
  # ================= answerable =================
  - id: rg-001
    query: "无理由退货窗口几天"
    store_id: 1
    answerable: true
    acceptable_docs: [七日无理由退货底线]

  - id: rg-002
    query: "耳机可以退货吗"
    store_id: 1
    answerable: true
    acceptable_docs: [店铺补充售后政策（STORE_01）]

  - id: rg-003
