# Tool Plan Correctness 测试集（M1）— 全量 45 条
#
# schema 约定（对齐 evaluation-plan-v1.md §2.1 / §3.1）：
#   id            唯一标识
#   mode          CUSTOMER_SERVICE / OPERATIONS / UNSET
#   store_id      门店（1）
#   question      用户问题
#   plan_type     single_tool | multi_tool | knowledge_qa | workflow_request
#                 | capability | clarify | no_tool
#   acceptable_plan 期望计划（可接受集，允许多合法路径）：
#     type        = plan_type
#     required_tools  必须调用（C ∩ required ≠ ∅）——多值 = 任一命中即可（多合法路径）
#     allowed_tools   允许全集（C ⊆ allowed，无集外工具；缺省 = required_tools）
#     required_args   对命中工具须带的参数键值（case-level 判定）
#     domain          仅 capability：期望请求切换的域
#
# 判定（§3.1）：
#   - 计划对 = required_tools 命中 且 无集外工具（C ⊆ allowed_tools）
#   - capability = 调用了 request_capability(domain) 且未越权调业务工具
#   - clarify = 无工具调用且返回需用户补充；no_tool = 无工具调用且正常回答
#   - Precision/Recall 仅 tool-bearing cases；clarify/no_tool 标 N/A
# 分布：12 单 + 4 知识 + 4 workflow + 8 多 + 5 clarify + 5 no_tool + 4 capability + 3 边界
# 实体均来自 DB 实测（order_no/sku_code 存在）

